<header>
    <nav>

        {% if request.endpoint == 'login' %}

            <a href="{{ url_for('about') }}">
                Sobre
            </a>

        {% elif request.endpoint == 'cadastro' %}

            <a href="{{ url_for('about') }}">
                Sobre
            </a>

        {% elif user_id %}

            <a href="{{ url_for('about') }}">
                Sobre
            </a>

            <a href="{{ url_for('profile', user_id=user_id) }}">
                Perfil
            </a>

            <a href="{{ url_for('login') }}">
                Sair
            </a>

        {% else %}

            <a href="{{ url_for('index') }}">
                Início
            </a>

            <a href="{{ url_for('about') }}">
                Sobre
            </a>

        {% endif %}

    </nav>
</header>
